version: 2.1

# =============================================================================
# Why this config looks the way it does
# =============================================================================
#
# Install dependencies, build the publishable packages, run the Vitest suite —
# on every push. The shape (two parallel test jobs rather than one) and most of
# the tuning below came out of watching real runs fail, so the reasoning is
# recorded here rather than rediscovered.
#
# -----------------------------------------------------------------------------
# EXECUTOR IMAGE — cimg/node:22.23.2
# -----------------------------------------------------------------------------
#
#   The root package.json pins `"engines": { "node": "^22.13.0 || ^24.0.0 ||
#   ^26.0.0" }`, and CONTRIBUTING.md tells contributors to install Node v22.13,
#   v24, or v26. Note that this rules out the `cimg/node:22.4` used in the
#   circleci/setup-node README example: 22.4 < 22.13. We use the Node 22 line
#   because it is the active LTS and the *lowest* line this repo supports —
#   building and testing on the floor is what catches accidental use of
#   Node-24-only APIs.
#
#   The tag is pinned to an exact patch (22.23.2, the newest cimg/node 22.x)
#   rather than the floating `22` or `22.23` tags, so a re-run six months from
#   now uses the same interpreter and any Node-version-induced failure shows up
#   as a deliberate config change instead of a mystery.
#
#   We use the plain variant, not `-browsers`. The only browser-driven suite in
#   the repo is @ai-sdk/rsc's Playwright e2e, which these jobs skip (see
#   SKIP_RSC_E2E below), so the extra Chrome/Firefox/driver layers would be
#   pulled on every job for nothing.
#
#   cimg/node also ships pnpm preinstalled, which matters here: this is a pnpm
#   workspace (pnpm-lock.yaml + pnpm-workspace.yaml, 80 packages). The repo
#   pins `"packageManager": "pnpm@11.23.0"`, and pnpm >= 10 honours that field
#   by default (manage-package-manager-versions), so the preinstalled binary
#   hands off to exactly 11.23.0 — confirmed in the job log, no corepack setup
#   needed. pnpm 11 is a hard requirement regardless, because
#   pnpm-workspace.yaml uses the v11 `allowBuilds` and `minimumReleaseAge` keys.
#
# -----------------------------------------------------------------------------
# INSTALL — circleci/setup-node, no flags
# -----------------------------------------------------------------------------
#
#   Every flag this function takes is already correct by default for this repo,
#   so passing any of them would be noise:
#     * --app-dir defaults to `.`, which is right even though this is a
#       monorepo: the lockfile and pnpm-workspace.yaml live at the repo root,
#       so the workspace root *is* the install root. There is no per-package
#       install to point at.
#     * the package manager is auto-detected from pnpm-lock.yaml, so
#       `--package-manager pnpm` would just restate what the lockfile says.
#     * --with-cache is on by default, which is what we want — the pnpm store
#       it stores is ~1.2 GB, and the cache key already busts on a lockfile
#       change. Restoring it takes install from ~85 s cold to ~60 s warm.
#   Because the function owns the whole cache lifecycle internally, there are
#   deliberately NO restore_cache / save_cache steps wrapped around it; the
#   README calls that out explicitly and adding them would fight the function.
#   The frozen install (`pnpm install --frozen-lockfile`) is the behaviour we
#   want in CI: fail loudly if the lockfile has drifted from package.json
#   rather than silently resolving different versions than a developer gets.
#
# -----------------------------------------------------------------------------
# BUILD — `pnpm build:packages`, not `pnpm build`
# -----------------------------------------------------------------------------
#
#   `pnpm build` runs `turbo build` over *every* workspace, which pulls in
#   examples/* (27 demo apps, several of them Next.js) and apps/docs. Those are
#   demos and documentation: they are not published, they are not what the test
#   suite consumes, and turbo threads ~50 provider API keys into their build
#   env — none of which exist in CI. `pnpm build:packages`
#   (`turbo build --filter=@ai-sdk/* --filter=ai`) builds every publishable
#   package, and those are exactly the workspaces that own a `test` script, so
#   nothing the test steps need is missing.
#
#   The build keeps the repo's own `--concurrency 16`: it has completed cleanly
#   on every run (227-308 s) and there is nothing to buy by slowing it down.
#
# -----------------------------------------------------------------------------
# WHY TWO TEST JOBS
# -----------------------------------------------------------------------------
#
#   This is the part that was arrived at empirically, so here is the evidence.
#
#   Running the whole suite in one container as `pnpm test`
#   (`turbo test --concurrency 16 --filter=!@example/*`) does not fit. Vitest
#   sizes its own worker pool from os.availableParallelism(), which correctly
#   reports the container's quota — the toolchain step below prints host vs
#   container core counts (36 vs 4) so you can verify that. So the repo's
#   default fan-out is ~16 packages in flight x 4 workers = ~64 Vitest workers
#   sharing 4 vCPUs and 8 GB. That is tuned for a workstation, and it failed
#   here in two distinct ways:
#
#     * MEMORY. ~64 workers in 8 GB is ~128 MB each, and some suites need far
#       more — packages/provider-utils' uint8-utils.node.test.ts deliberately
#       spawns a subprocess to prove a 14 MB buffer encodes inside a 128 MiB
#       heap. One run was OOM-killed outright: every test up to that point
#       passed, and the step ended with no error output, no turbo summary, and
#       exit code unset (CircleCI reports that as `canceled`). That is the
#       signature to look for if this regresses.
#     * CPU. Several suites sit within a few hundred milliseconds of Vitest's
#       default 5 s per-test timeout, and they are import-bound rather than
#       assertion-bound — @ai-sdk/gateway's edge run reports ~80 s of import
#       against ~25 s of actual test time. Under contention they fail on
#       timeout with no assertion error. Three were observed doing so:
#         - ai              "emits declarations for exported values with
#                            inferred output types" — imports the whole
#                            TypeScript compiler and runs a real declaration
#                            emit inside its 5 s budget
#         - @ai-sdk/gateway "rejects minting (getToken) in browsers — the
#                            credential must stay server-side"
#         - @ai-sdk/google  "uses a resumable file upload when the creation
#                            body reaches 20 MB"
#
#   Dropping to `--concurrency 6` (~24 workers, ~330 MB each) fixed the memory
#   problem and cost nothing in wall-clock — it was actually slightly faster
#   than 16, because less contention beat more parallelism. But `ai:test` then
#   failed on the first attempt of *every* run: it is by far the largest
#   package (183 test files) and it was being starved by the other 85.
#
#   Hence the split, which mirrors what this repo already does upstream — the
#   `test:ci` script exists precisely to exclude `ai` and `@ai-sdk/codemod`
#   because they run as their own job there:
#     * test-packages  — everything except `ai` and `@ai-sdk/codemod`
#     * test-core      — `ai` and `@ai-sdk/codemod`, with the container to
#                        themselves
#   Verified with `turbo test --dry=json` that the two filter sets partition
#   the suite exactly: 86 + 2 = 88 test tasks, no gaps and no overlap. The two
#   jobs run in parallel, so splitting costs a duplicated install and build
#   rather than wall-clock.
#
# -----------------------------------------------------------------------------
# THE TEST STEP STILL RETRIES ONCE
# -----------------------------------------------------------------------------
#
#   Kept as a safety net for the load-sensitive tests listed above, not as the
#   mechanism that makes the suite pass — the split is what does that.
#
#   It is cheap because turbo caches successful `test` tasks (verified: a
#   second invocation reports "cache hit, replaying logs"), so a retry
#   re-executes *only* the packages that failed, which then get the container
#   almost to themselves. It is bounded at one extra attempt deliberately: a
#   deterministic failure fails both attempts and the job still goes red, so
#   this absorbs contention flakes without hiding real bugs. If a test fails
#   twice, that is signal.
#
#   A retry that fires on every single run means the split has stopped doing
#   its job and something needs rebalancing — worth checking for, since that is
#   exactly the state this config was in before the split.
#
# -----------------------------------------------------------------------------
# ODDS AND ENDS
# -----------------------------------------------------------------------------
#
#   SKIP_RSC_E2E=1 — @ai-sdk/rsc's `test` script chains `test:e2e:ci`, which
#   shells out to Playwright against a real Next.js server. The repo ships this
#   env var as the supported opt-out (packages/rsc/scripts/run-e2e-ci.mjs
#   checks it, and turbo.json declares it on the `test` task), because browser
#   e2e needs the `-browsers` image plus `playwright install --with-deps` and a
#   server warm-up — a different job's worth of setup. @ai-sdk/rsc's node,
#   edge, and React UI Vitest suites all still run. This is the one part of the
#   test suite this pipeline does not cover.
#
#   TURBO_TELEMETRY_DISABLED / DO_NOT_TRACK — stops turbo's first-run telemetry
#   notice and its outbound call, so the log is just the build and the job does
#   not depend on an unrelated endpoint.
#
#   no_output_timeout — CircleCI kills a step after 10 minutes of silence by
#   default. Turbo can sit quiet for longer while a slow package's DTS build or
#   Vitest suite runs, so build and test get a wider window; the job would
#   otherwise die from a healthy-but-quiet step.
#
#   resource_class: large — `medium` (2 vCPU / 4 GB) is too small for this
#   fan-out. `xlarge` was tried and is not available on this account's plan:
#   the job failed in under a second with "Task information unavailable" and
#   produced no step logs at all. If your plan does grant xlarge, raising the
#   class is a better trade than tuning concurrency further.
#
#   Scaling further — if these jobs become the bottleneck, shard the packages
#   across containers with CircleCI `parallelism` and split the turbo
#   `--filter` per shard, rather than pushing a single container harder.
#
#   Not `pnpm test:ci` directly — that script hardcodes both the exclusions and
#   `--concurrency 16`, and we need a different concurrency and the matching
#   complement job. The task *selection* is identical to the repo's scripts.
#
#   TRIGGER — one workflow, no branch/tag filters, so it runs on every push to
#   every branch.
# =============================================================================

commands:
  install-and-build:
    description: Checkout, frozen install via circleci/setup-node, build packages.
    steps:
      - checkout

      - run:
          name: Install Node packages
          command: circleci run circleci/setup-node@0.0.1-15ea7e5 -- install

      - run:
          name: Report toolchain versions
          command: |
            echo "node:                      $(node --version)"
            echo "pnpm:                      $(pnpm --version)"
            # Worth knowing when reading a timeout failure: `nproc` and
            # os.cpus() report the *host's* core count inside a CircleCI Docker
            # container, while os.availableParallelism() reports the container's
            # actual quota. Vitest sizes its worker pool from the latter, so
            # this is the number that governs test parallelism.
            echo "nproc (host):              $(nproc)"
            echo "os.cpus().length (host):   $(node -e 'console.log(require("node:os").cpus().length)')"
            echo "availableParallelism:      $(node -e 'console.log(require("node:os").availableParallelism())')"

      - run:
          name: Build packages
          command: pnpm build:packages
          no_output_timeout: 30m

  run-test-suite:
    description: >
      Run the turbo `test` task for the given filters, retrying once. See the
      comment block at the top of this file for why the retry exists and why
      the concurrency is below the repo's default of 16.
    parameters:
      filters:
        description: turbo --filter arguments selecting this job's packages.
        type: string
      concurrency:
        description: Max packages turbo runs at once.
        type: string
    steps:
      - run:
          name: Run test suite
          command: |
            run_suite() {
              pnpm exec turbo test \
                --concurrency << parameters.concurrency >> \
                << parameters.filters >>
            }

            if run_suite; then
              exit 0
            fi

            echo
            echo "================================================================"
            echo "Test suite failed. Retrying once."
            echo
            echo "Turbo caches successful test tasks, so this retry re-executes"
            echo "only the packages that actually failed - they get the container"
            echo "to themselves, which is enough for the load-sensitive suites"
            echo "documented at the top of this config."
            echo
            echo "If the same test fails again below, it is a real failure."
            echo "================================================================"
            echo

            run_suite
          no_output_timeout: 30m

jobs:
  # Everything except the two heavyweight packages.
  test-packages:
    docker:
      - image: cimg/node:22.23.2
    resource_class: large
    environment:
      SKIP_RSC_E2E: '1'
      TURBO_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
    steps:
      - install-and-build
      - run-test-suite:
          filters: "--filter='!@example/*' --filter='!ai' --filter='!@ai-sdk/codemod'"
          concurrency: '6'

  # `ai` (183 test files) and `@ai-sdk/codemod`, with room to breathe.
  test-core:
    docker:
      - image: cimg/node:22.23.2
    resource_class: large
    environment:
      SKIP_RSC_E2E: '1'
      TURBO_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
    steps:
      - install-and-build
      - run-test-suite:
          filters: "--filter='ai' --filter='@ai-sdk/codemod'"
          concurrency: '2'

workflows:
  build-and-test:
    jobs:
      - test-packages
      - test-core
