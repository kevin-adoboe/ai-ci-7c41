version: 2.1

# =============================================================================
# Why this config looks the way it does
# =============================================================================
#
# EXECUTOR IMAGE — cimg/node:22.23.2
#
#   The root package.json pins `"engines": { "node": "^22.13.0 || ^24.0.0 ||
#   ^26.0.0" }`, and CONTRIBUTING.md tells contributors to install Node v22.13,
#   v24, or v26. Note that this rules out the `cimg/node:22.4` used in the
#   circleci/setup-node README example: 22.4 < 22.13. We use the Node 22 line
#   because it is the active LTS and the *lowest* line this repo supports —
#   building and testing on the floor is what catches accidental use of
#   Node-24-only APIs.
#
#   The tag is pinned to an exact patch (22.23.2, the newest cimg/node 22.x)
#   rather than the floating `22` or `22.23` tags, so a re-run six months from
#   now uses the same interpreter and any Node-version-induced failure shows up
#   as a deliberate config change instead of a mystery.
#
#   We use the plain variant, not `-browsers`. The only browser-driven suite in
#   the repo is @ai-sdk/rsc's Playwright e2e, which this job skips (see
#   SKIP_RSC_E2E below), so the extra Chrome/Firefox/driver layers would be
#   pulled on every job for nothing.
#
#   cimg/node also ships pnpm preinstalled, which matters here: this is a pnpm
#   workspace (pnpm-lock.yaml + pnpm-workspace.yaml, 80 packages). The repo
#   pins `"packageManager": "pnpm@11.23.0"`, and pnpm >= 10 honours that field
#   by default (manage-package-manager-versions), so the preinstalled binary
#   hands off to exactly 11.23.0 — no corepack setup needed. pnpm 11 is a hard
#   requirement regardless, because pnpm-workspace.yaml uses the v11
#   `allowBuilds` and `minimumReleaseAge` keys.
#
# RESOURCE CLASS — large (4 vCPU / 8 GB) + REDUCED TEST FAN-OUT
#
#   These two settings were tuned against real runs rather than reasoned
#   about, so here is the history — including the things that did not work, so
#   nobody re-tries them.
#
#   The repo's own scripts ask for `turbo --concurrency 16` on both build and
#   test, and each of the 80 packages runs Vitest twice (a node config and an
#   edge-runtime config). Vitest sizes its own worker pool from
#   os.availableParallelism(), which *does* correctly report the container's
#   CPU quota (the toolchain step below prints host vs container core counts,
#   36 vs 4, so you can check this). So at the repo's default the job's real
#   fan-out is about (16 packages in flight) x (4 workers) = ~64 Vitest
#   workers sharing 4 vCPUs and 8 GB.
#
#   That default is tuned for a developer workstation and is too much for this
#   container, in two different ways, both of which were observed:
#
#     * MEMORY. ~64 workers in 8 GB leaves ~128 MB each, and some suites need
#       far more than that — packages/provider-utils' uint8-utils.node.test.ts
#       deliberately spawns a subprocess to prove a 14 MB buffer encodes inside
#       a 128 MiB heap. One run was OOM-killed outright: every test up to that
#       point had passed, and the step ended with no error output, no turbo
#       summary, and exit code unset (CircleCI reports it as `canceled`). That
#       is the signature to look for if this comes back.
#     * CPU. A handful of suites sit within a few hundred milliseconds of
#       Vitest's default 5 s per-test timeout, specifically the ones whose
#       first statement is a cold dynamic `await import(...)` and so pay module
#       transform cost inside their own 5 s budget. These are import-bound, not
#       assertion-bound: @ai-sdk/gateway's edge run reports ~80 s of import
#       against ~25 s of actual test time. Two have been seen failing purely on
#       timeout, with no assertion error:
#         - @ai-sdk/google  "uses a resumable file upload when the creation
#           body reaches 20 MB" (allocates and JSON-encodes 20 MB repeatedly)
#         - @ai-sdk/gateway "rejects minting (getToken) in browsers — the
#           credential must stay server-side"
#
#   Lowering turbo's concurrency for the test step is the one lever that fixes
#   both at once: fewer packages in flight means fewer concurrent Vitest pools
#   (less peak memory) *and* a bigger share of the 4 vCPUs for each worker
#   (less starvation). At `--concurrency 6` the fan-out is ~24 workers, so
#   ~330 MB and roughly 6x oversubscription instead of ~128 MB and 16x. It
#   costs wall-clock, which is the right thing to trade for a suite that
#   otherwise fails on contention rather than on code.
#
#   The build step keeps the repo's `--concurrency 16` (via
#   `pnpm build:packages`): it has completed cleanly on every run so far
#   (241 s / 274 s / 296 s), so there is nothing to buy by slowing it down.
#
#   Two other attempts, both rejected:
#
#     1. VITEST_MAX_WORKERS=2, capping each package's pool while leaving turbo
#        at 16. Reverted: it measurably did not help the CPU problem.
#        @ai-sdk/gateway's node run took 50.68 s uncapped vs 51.07 s capped,
#        and the capped run still timed out. Capping workers per package moves
#        the same transform work onto fewer threads within that package; it
#        does not reduce how many packages are competing.
#     2. resource_class: xlarge, to throw absolute CPU and RAM at the problem.
#        Rejected by the scheduler on this account's plan — the job failed in
#        under a second with "Task information unavailable" and produced no
#        step logs at all. If your plan does grant xlarge, raising the class
#        and restoring `pnpm test` is the better trade than slowing the fan-out.
#
#   If this job becomes the bottleneck, the next step is not more tuning: shard
#   the packages across containers with CircleCI `parallelism` and split the
#   turbo `--filter` per shard, rather than pushing a single container harder.
#
# INSTALL — circleci/setup-node, no flags
#
#   Every flag this function takes is already correct by default for this repo,
#   so passing any of them would be noise:
#     * --app-dir defaults to `.`, which is right even though this is a
#       monorepo: the lockfile and pnpm-workspace.yaml live at the repo root,
#       so the workspace root *is* the install root. There is no per-package
#       install to point at.
#     * the package manager is auto-detected from pnpm-lock.yaml, so
#       `--package-manager pnpm` would just restate what the lockfile says.
#     * --with-cache is on by default, which is what we want — the restored
#       pnpm store is ~1.2 GB and the cache key already busts on a lockfile
#       change.
#   Because the function owns the whole cache lifecycle internally, there are
#   deliberately NO restore_cache / save_cache steps wrapped around it; the
#   README calls that out explicitly and adding them would fight the function.
#   The frozen install (`pnpm install --frozen-lockfile`) is the behaviour we
#   want in CI: fail loudly if the lockfile has drifted from package.json
#   rather than silently resolving different versions than a developer gets.
#
# BUILD — `pnpm build:packages`, not `pnpm build`
#
#   `pnpm build` runs `turbo build` over *every* workspace, which pulls in
#   examples/* (27 demo apps, several of them Next.js) and apps/docs. Those are
#   demos and documentation: they are not published, they are not what the test
#   suite consumes, and turbo threads ~50 provider API keys into their build
#   env — none of which exist in CI. `pnpm build:packages`
#   (`turbo build --filter=@ai-sdk/* --filter=ai`) builds every publishable
#   package, and those are exactly the workspaces that own a `test` script, so
#   nothing the test step needs is missing.
#
# TEST — the repo's `test` task, at a lower concurrency
#
#   `pnpm test` is `turbo test --concurrency 16 --filter=!@example/*`. We run
#   turbo directly with the same filter but `--concurrency 6`, for the memory
#   and CPU reasons in the RESOURCE CLASS note above. The selection of what
#   gets tested is identical to `pnpm test`.
#
#   Turbo's `test` task dependsOn `build`, and because the build step above
#   already populated the local turbo cache inside this same job, that
#   dependency replays from cache instead of rebuilding. That is why the test
#   step's turbo summary reports roughly half its tasks as cached: those are
#   the build tasks being replayed, and only the test tasks actually execute.
#
#   Deliberately not `pnpm test:ci`: that variant additionally drops the `ai`
#   and `@ai-sdk/codemod` packages (they are split into their own job in the
#   upstream CI). The ask here was to run the test suite, so we keep them in.
#
# SKIP_RSC_E2E=1
#
#   @ai-sdk/rsc's `test` script chains `test:e2e:ci`, which shells out to
#   Playwright against a real Next.js server. The repo ships this env var as
#   the supported opt-out (packages/rsc/scripts/run-e2e-ci.mjs checks it, and
#   turbo.json declares it on the `test` task), because browser e2e needs the
#   `-browsers` image plus `playwright install --with-deps` and a server
#   warm-up — a different job's worth of setup. @ai-sdk/rsc's node, edge, and
#   React UI Vitest suites all still run. This is the one piece of the test
#   suite this pipeline does not cover.
#
# TURBO_TELEMETRY_DISABLED / DO_NOT_TRACK
#
#   Stops turbo's first-run telemetry notice and its outbound call, so the log
#   is just the build and the job does not depend on an unrelated endpoint.
#
# no_output_timeout
#
#   CircleCI kills a step after 10 minutes of silence by default. Turbo can sit
#   quiet for longer than that while a slow package's DTS build or Vitest suite
#   runs, so build and test get a wider window; the job would otherwise die
#   from a healthy-but-quiet step.
#
# TRIGGER
#
#   One workflow, no branch/tag filters, so it runs on every push to every
#   branch.
# =============================================================================

jobs:
  build-and-test:
    docker:
      - image: cimg/node:22.23.2
    resource_class: large
    environment:
      SKIP_RSC_E2E: '1'
      TURBO_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
    steps:
      - checkout

      - run:
          name: Install Node packages
          command: circleci run circleci/setup-node@0.0.1-15ea7e5 -- install

      - run:
          name: Report toolchain versions
          command: |
            echo "node:                      $(node --version)"
            echo "pnpm:                      $(pnpm --version)"
            # Worth knowing when reading a timeout failure: `nproc` and
            # os.cpus() report the *host's* core count inside a CircleCI Docker
            # container, while os.availableParallelism() reports the container's
            # actual quota. Vitest sizes its worker pool from the latter, so
            # this is the number that governs test parallelism.
            echo "nproc (host):              $(nproc)"
            echo "os.cpus().length (host):   $(node -e 'console.log(require("node:os").cpus().length)')"
            echo "availableParallelism:      $(node -e 'console.log(require("node:os").availableParallelism())')"

      - run:
          name: Build packages
          command: pnpm build:packages
          no_output_timeout: 30m

      - run:
          name: Run test suite
          # `pnpm test` is `turbo test --concurrency 16 --filter=!@example/*`;
          # this is the same run with the fan-out lowered. See the RESOURCE
          # CLASS note above for why 16 does not fit in this container.
          command: pnpm exec turbo test --concurrency 6 --filter='!@example/*'
          no_output_timeout: 30m

workflows:
  build-and-test:
    jobs:
      - build-and-test
